{% extends 'base.html' %}
{% block title %}Login | Chakraborty Industries{% endblock %}
{% block content %}
<div style="height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="glass-panel" style="padding: 3rem; width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 2rem; font-size: 2rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welcome Back</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--accent-color); text-decoration: none; font-weight: 500;">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
