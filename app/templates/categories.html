{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold">Categories</h2>
        <p class="text-muted">Organize your products efficiently</p>
    </div>
    <button class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
        <i class="fas fa-plus me-2"></i> Add Category
    </button>
</div>

<div class="row g-4">
    {% for category in categories %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 border-0 shadow-sm transition-hover">
            <div class="card-body text-center p-4">
                <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3 text-primary">
                    <i class="fas fa-tags fa-xl"></i>
                </div>
                <h5 class="card-title fw-bold mb-1">{{ category.name }}</h5>
                <p class="card-text text-muted mb-4">{{ category.products|length }} Products</p>

                <div class="d-flex justify-content-center gap-2">
                    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addProductModal"
                        data-category-id="{{ category.id }}">
                        <i class="fas fa-plus me-1"></i> Product
                    </button>
                    <!-- Future: View Products Filtered by Category -->
                    <!-- <a href="#" class="btn btn-outline-primary btn-sm">View</a> -->
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('inventory.add_category_page') }}" method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" name="cname" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-info text-white">Add Category</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Add Product Modal (Shared) -->
<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('inventory.add') }}" method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-control" name="pname" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="pcategory" id="categorySelect" required>
                            <option value="" disabled selected>Select a Category</option>
                            {% for c in categories %}
                            <option value="{{ c.id }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" class="form-control" name="pstock" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01" class="form-control" name="pprice" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-success">Add Product</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    var addProductModal = document.getElementById('addProductModal');
    addProductModal.addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        var categoryId = button.getAttribute('data-category-id');
        if (categoryId) {
            var select = addProductModal.querySelector('#categorySelect');
            select.value = categoryId;
        }
    });
</script>
{% endblock %}
